<body class="bg-[#E9F1EE] dark:bg-[#0D1E1B] text-[#12302B] dark:text-[#E4F1ED] min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- SOUND ENGINE (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch {}
      }
      playSuccess() {
        try {
          this.init();
          if (!this.ctx) return;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.09, this.ctx.currentTime + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.08);
            osc.stop(this.ctx.currentTime + i * 0.08 + 0.35);
          });
        } catch {}
      }
    }
    const sounds = new SoundEngine();

    // --- DATA: TREE SPECIES ---
    const TREE_SPECIES = [
      { id: 'pine', name: 'Карпатська Сосна', icon: '🌲', growDays: 14, desc: 'Символ незламності та вічної свіжості гір.' },
      { id: 'oak', name: 'Козацький Дуб', icon: '🌳', growDays: 21, desc: 'Міць предків та залізна воля до свободи.' },
      { id: 'apple', name: 'Садова Яблуня', icon: '🍎', growDays: 16, desc: 'Солодкі плоди твого нового життя.' },
      { id: 'sakura', name: 'Весняна Сакура', icon: '🌸', growDays: 18, desc: 'Цвітіння і відродження дихання.' },
      { id: 'maple', name: 'Золотий Клен', icon: '🍁', growDays: 15, desc: 'Гармонія спокою та чистого розуму.' }
    ];

    // --- DATA: HEALTH MILESTONES ---
    const HEALTH_MILESTONES = [
      { t: 20 * 60 * 1000, title: '20 хвилин', icon: '❤️', desc: 'Пульс і тиск нормалізуються. Кровообіг у руках і ногах покращується.' },
      { t: 8 * 3600 * 1000, title: '8 годин', icon: '🩸', desc: 'Рівень чадного газу впав удвічі. Рівень кисню в крові сягнув норми.' },
      { t: 24 * 3600 * 1000, title: '24 години', icon: '🫀', desc: 'Чадний газ виведений повністю. Ризик раптового серцевого нападу почав знижуватись.' },
      { t: 48 * 3600 * 1000, title: '48 годин', icon: '👅', desc: 'Нікотин повністю виведено. Смакові рецептори та нюх стрімко повертаються.' },
      { t: 72 * 3600 * 1000, title: '72 години', icon: '⚡', desc: 'Бронхіоли розслабляються, дихати легше. Фізичний пік ломки позаду!' },
      { t: 14 * 24 * 3600 * 1000, title: '2 тижні', icon: '🫁', desc: 'Кровообіг покращився на 30%. Ходьба та спорт даються без задишки.' },
      { t: 30 * 24 * 3600 * 1000, title: '1 місяць', icon: '🏃', desc: 'Кашель і свист у грудях зникають. Енергія повертається на повну силу.' },
      { t: 90 * 24 * 3600 * 1000, title: '3 місяці', icon: '✨', desc: 'Об’єм легень зріс на 10%. Легеневі війки очищують дихальні шляхи.' },
      { t: 365 * 24 * 3600 * 1000, title: '1 рік', icon: '👑', desc: 'Ризик ішемічної хвороби серця зменшився вдвічі порівняно з курцем!' }
    ];

    // --- DATA: GOALS PRESETS ---
    const GOAL_PRESETS = [
      { name: 'Святкова вечеря', amount: 1000, icon: '🍽️', desc: 'Нагородити себе за чисті дні' },
      { name: 'Бездротові навушники', amount: 3500, icon: '🎧', desc: 'Якісна музика для прогулянок' },
      { name: 'Бігові кросівки', amount: 4200, icon: '👟', desc: 'Спорт і біг без задишки' },
      { name: 'Абонемент у зал', amount: 5500, icon: '🏊', desc: 'Повне відновлення форми' },
      { name: 'Смарт-годинник', amount: 7500, icon: '⌚', desc: 'Контроль пульсу та сну' },
      { name: 'Вікенд у Карпатах', amount: 9500, icon: '🌲', desc: 'Чисте гірське повітря для легень' },
      { name: 'Новий смартфон', amount: 25000, icon: '📱', desc: 'Матеріальна цінність замість диму' }
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // LocalStorage State Keys
      const [startDate, setStartDate] = useState(() => {
        const v = localStorage.getItem('bez_start');
        return v ? Number(v) : Date.now() - 36 * 3600 * 1000;
      });

      const [money, setMoney] = useState(() => {
        const v = localStorage.getItem('bez_money');
        return v ? JSON.parse(v) : { perDay: 15, packPrice: 100, packSize: 20, cur: '₴' };
      });

      const [goals, setGoals] = useState(() => {
        const v = localStorage.getItem('bez_goals');
        return v ? JSON.parse(v) : {
          base: 0,
          queue: [
            { id: 'g1', name: 'Бездротові навушники', amount: 3500, icon: '🎧' },
            { id: 'g2', name: 'Вікенд у горах', amount: 9500, icon: '🌲' }
          ],
          done: []
        };
      });

      const [treeState, setTreeState] = useState(() => {
        const v = localStorage.getItem('bez_tree');
        return v ? JSON.parse(v) : {
          forest: [],
          current: { speciesId: 'pine', plantedAt: Date.now() - 3600000, growth: 12, water: 90, weeds: [] }
        };
      });

      const [reasons, setReasons] = useState(() => {
        const v = localStorage.getItem('bez_reasons');
        return v ? JSON.parse(v) : [
          'Я хочу дихати на повні груди без задишки',
          'Моє серце і судини будуть міцними й здоровими',
          'Я хочу бути сильним прикладом для своїх близьких',
          'Гроші мають іти на мрії, а не на попіл і дим'
        ];
      });

      const [daysRating, setDaysRating] = useState(() => {
        const v = localStorage.getItem('bez_days');
        return v ? JSON.parse(v) : {};
      });

      const [activeTab, setActiveTab] = useState('counter');
      const [diffMs, setDiffMs] = useState(() => Math.max(0, Date.now() - startDate));
      const [isSosOpen, setIsSosOpen] = useState(false);
      const [isSetupOpen, setIsSetupOpen] = useState(false);
      const [newReasonText, setNewReasonText] = useState('');

      // Timer
      useEffect(() => {
        const tick = () => setDiffMs(Math.max(0, Date.now() - startDate));
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [startDate]);

      // Sync to localStorage
      useEffect(() => { localStorage.setItem('bez_start', String(startDate)); }, [startDate]);
      useEffect(() => { localStorage.setItem('bez_money', JSON.stringify(money)); }, [money]);
      useEffect(() => { localStorage.setItem('bez_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('bez_tree', JSON.stringify(treeState)); }, [treeState]);
      useEffect(() => { localStorage.setItem('bez_reasons', JSON.stringify(reasons)); }, [reasons]);
      useEffect(() => { localStorage.setItem('bez_days', JSON.stringify(daysRating)); }, [daysRating]);

      // Metrics calculation
      const totalDays = Math.floor(diffMs / (24 * 3600 * 1000));
      const cigsAvoided = money ? (diffMs / (24 * 3600 * 1000)) * money.perDay : 0;
      const totalSaved = money ? (cigsAvoided / money.packSize) * money.packPrice : 0;
      const dailyCost = money ? (money.perDay / money.packSize) * money.packPrice : 0;

      // Active goal
      const activeGoal = goals.queue[0];
      const withinCurrentGoal = activeGoal ? Math.max(0, totalSaved - goals.base) : 0;
      const activeGoalPct = activeGoal ? Math.min(100, Math.floor((withinCurrentGoal / activeGoal.amount) * 100)) : 0;

      // Goal completion logic:
      // When goal is fulfilled, it moves to 'done' and base is updated to current totalSaved,
      // so accumulation for the NEXT goal starts from 0 at this exact moment!
      const completeActiveGoal = () => {
        if (!activeGoal) return;
        sounds.playSuccess();
        const completed = { ...activeGoal, at: Date.now(), total: activeGoal.amount };
        setGoals(prev => ({
          ...prev,
          base: totalSaved, // Accumulation for next goal starts from current totalSaved!
          queue: prev.queue.slice(1),
          done: [completed, ...(prev.done || [])]
        }));
      };

      // Format time
      const days = Math.floor(diffMs / (24 * 3600 * 1000));
      const hours = Math.floor((diffMs % (24 * 3600 * 1000)) / (3600 * 1000));
      const minutes = Math.floor((diffMs % (3600 * 1000)) / (60 * 1000));
      const seconds = Math.floor((diffMs % (60 * 1000)) / 1000);

      // Formatted human quit time with Ukrainian declensions
      const humanQuitTimeText = useMemo(() => {
        const getDaysWord = (d) => {
          const m10 = d % 10;
          const m100 = d % 100;
          if (m100 >= 11 && m100 <= 14) return 'днів';
          if (m10 === 1) return 'день';
          if (m10 >= 2 && m10 <= 4) return 'дні';
          return 'днів';
        };

        const getHoursWord = (h) => {
          const m10 = h % 10;
          const m100 = h % 100;
          if (m100 >= 11 && m100 <= 14) return 'годин';
          if (m10 === 1) return 'година';
          if (m10 >= 2 && m10 <= 4) return 'години';
          return 'годин';
        };

        if (days > 0) {
          return `Ти не куриш ${days} ${getDaysWord(days)}, ${hours} ${getHoursWord(hours)} і ${minutes}хв`;
        }
        if (hours > 0) {
          return `Ти не куриш ${hours} ${getHoursWord(hours)} і ${minutes}хв`;
        }
        return `Ти не куриш ${Math.max(1, minutes)}хв`;
      }, [days, hours, minutes]);

      // Packs avoided text (e.g. 123.8 пачки)
      const packsCountVal = money ? (cigsAvoided / money.packSize) : 0;
      const packsStr = packsCountVal.toFixed(1);
      const packsAvoidedText = packsStr.endsWith('.0')
        ? (() => {
            const iv = Math.round(packsCountVal);
            const m10 = iv % 10;
            const m100 = iv % 100;
            if (m100 >= 11 && m100 <= 14) return `${iv} пачок`;
            if (m10 === 1) return `${iv} пачка`;
            if (m10 >= 2 && m10 <= 4) return `${iv} пачки`;
            return `${iv} пачок`;
          })()
        : `${packsStr} пачки`;

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 pt-6 pb-24">
          {/* Header (No logo or brand text as requested) */}
          <header className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-1.5 text-xs text-[#55726B] dark:text-[#8FAAA3]" title="Еко-режим батареї">
              <span>🔋</span>
            </div>
            <button
              onClick={() => {
                document.documentElement.classList.toggle('dark');
                sounds.playClick();
              }}
              className="p-2 border border-[#B7CDC6] dark:border-[#2A4A43] rounded-xl text-xs font-bold text-[#55726B] dark:text-[#8FAAA3]"
            >
              🌓 Тема
            </button>
          </header>

          {/* TAB 1: COUNTER (ГОЛОВНА) */}
          {activeTab === 'counter' && (
            <div className="space-y-4 animate-in fade-in duration-200">
              {/* 1. КАРТКА ЛЮДИНИ */}
              <div className="p-4 bg-white/80 dark:bg-[#112723]/80 border border-[#B7CDC6] dark:border-[#2A4A43] rounded-2xl shadow-xs">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#1E8A69]/20 to-[#4CC9A0]/30 dark:from-[#1E8A69]/40 dark:to-[#4CC9A0]/20 flex items-center justify-center text-xl flex-none border border-[#1E8A69]/30 shadow-xs">
                    👤
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-1.5 mb-1">
                      <span className="w-2 h-2 rounded-full bg-[#1E8A69] dark:bg-[#4CC9A0] animate-pulse"></span>
                      <span className="text-[11px] font-medium text-[#55726B] dark:text-[#8FAAA3]">
                        Час оновлюється щохвилинно
                      </span>
                    </div>
                    <h1 className="text-base sm:text-lg font-bold text-[#12302B] dark:text-[#E4F1ED] leading-snug">
                      {humanQuitTimeText}
                    </h1>
                  </div>
                </div>
              </div>

              {/* 2. ЕКОНОМІЧНА СКЛАДОВА / МРІЇ */}
              <div>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  {/* 1. ЗАОЩАДЖЕНО */}
                  <button
                    onClick={() => { sounds.playClick(); setActiveTab('money'); }}
                    className="p-3 rounded-2xl bg-white/70 dark:bg-[#112723]/70 border border-[#B7CDC6] dark:border-[#2A4A43] hover:border-[#1E8A69] text-left transition-all cursor-pointer shadow-2xs group"
                  >
                    <span className="text-[11px] uppercase tracking-wider font-semibold text-[#55726B] dark:text-[#8FAAA3] block mb-0.5">
                      Заощаджено 💰
                    </span>
                    <span className="text-sm sm:text-base font-bold font-mono text-[#1E8A69] dark:text-[#4CC9A0] block">
                      {Math.floor(totalSaved)} {money.cur}
                    </span>
                    <span className="text-[10px] text-[#55726B] dark:text-[#8FAAA3] block opacity-80 mt-0.5">
                      Загальний капітал
                    </span>
                  </button>

                  {/* 2. НЕ ВИКУРЕНО */}
                  <button
                    onClick={() => { sounds.playClick(); setActiveTab('health'); }}
                    className="p-3 rounded-2xl bg-white/70 dark:bg-[#112723]/70 border border-[#B7CDC6] dark:border-[#2A4A43] hover:border-[#1E8A69] text-left transition-all cursor-pointer shadow-2xs group"
                  >
                    <span className="text-[11px] uppercase tracking-wider font-semibold text-[#55726B] dark:text-[#8FAAA3] block mb-0.5">
                      Не викурено 🚭
                    </span>
                    <span className="text-sm sm:text-base font-bold font-mono text-[#12302B] dark:text-[#E4F1ED] block">
                      {Math.floor(cigsAvoided)} шт.
                    </span>
                    <span className="text-[10px] text-[#55726B] dark:text-[#8FAAA3] block opacity-80 mt-0.5">
                      {packsAvoidedText}
                    </span>
                  </button>

                  {/* 3. ВИТРАЧЕНО НА МРІЇ */}
                  <button
                    onClick={() => { sounds.playClick(); setActiveTab('money'); }}
                    className="p-3 rounded-2xl bg-white/70 dark:bg-[#112723]/70 border border-[#B7CDC6] dark:border-[#2A4A43] hover:border-amber-500 text-left transition-all cursor-pointer shadow-2xs group"
                  >
                    <span className="text-[11px] uppercase tracking-wider font-semibold text-[#55726B] dark:text-[#8FAAA3] block mb-0.5">
                      Витрачено на мрії 🎁
                    </span>
                    <span className="text-sm sm:text-base font-bold font-mono text-amber-600 dark:text-amber-400 block">
                      {Math.floor((goals.done || []).reduce((a, g) => a + (g.total || g.amount), 0))} {money.cur}
                    </span>
                    <span className="text-[10px] text-[#55726B] dark:text-[#8FAAA3] block opacity-80 mt-0.5">
                      {(goals.done || []).length} здійснено
                    </span>
                  </button>

                  {/* 4. ДОСТУПНО НА МРІЇ */}
                  <button
                    onClick={() => { sounds.playClick(); setActiveTab('money'); }}
                    className="p-3 rounded-2xl bg-[#1E8A69]/10 dark:bg-[#1E8A69]/20 border border-[#1E8A69]/40 hover:border-[#1E8A69] text-left transition-all cursor-pointer shadow-2xs group"
                  >
                    <span className="text-[11px] uppercase tracking-wider font-semibold text-[#1E8A69] dark:text-[#4CC9A0] block mb-0.5">
                      Доступно на мрії ✨
                    </span>
                    <span className="text-sm sm:text-base font-bold font-mono text-[#1E8A69] dark:text-[#4CC9A0] block">
                      {Math.floor(Math.max(0, totalSaved - (goals.base || 0)))} {money.cur}
                    </span>
                    <span className="text-[10px] text-[#55726B] dark:text-[#8FAAA3] block opacity-80 mt-0.5">
                      Вільний баланс
                    </span>
                  </button>
                </div>

                {/* Active Goal Widget */}
                {activeGoal && (
                  <button
                    onClick={() => { sounds.playClick(); setActiveTab('money'); }}
                    className="w-full p-3 bg-gradient-to-r from-white/90 to-[#1E8A69]/10 dark:from-[#112723]/90 dark:to-[#4CC9A0]/10 border border-[#B7CDC6] dark:border-[#2A4A43] hover:border-[#1E8A69] rounded-2xl transition-all cursor-pointer shadow-2xs group text-left"
                  >
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="text-[11px] font-bold uppercase tracking-wider text-[#1E8A69] dark:text-[#4CC9A0] flex items-center gap-1">
                        <span>🎯</span>
                        <span>Поточна мета</span>
                      </span>
                      <span className="text-xs font-mono font-bold text-[#1E8A69] dark:text-[#4CC9A0]">{activeGoalPct}%</span>
                    </div>
                    <div className="flex items-center justify-between text-xs font-bold text-[#12302B] dark:text-[#E4F1ED] mb-1.5">
                      <span className="truncate">{activeGoal.icon || '🎯'} {activeGoal.name}</span>

                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-[#12302B] dark:text-[#E4F1ED] group-hover:text-[#1E8A69] transition-colors">
                      Щоденний стан та настрій
                    </h3>
                    <p className="text-xs text-[#55726B] dark:text-[#8FAAA3]">
                      Оцінка настрою, симптомів та самопочуття
                    </p>
                  </div>
                </div>
                <span className="text-xs text-[#1E8A69] dark:text-[#4CC9A0] font-bold">
                  Відкрити →
                </span>
              </button>

              {/* НАВІЩО Я КИНУВ КУРИТИ */}
              <div className="p-4 bg-white/70 dark:bg-[#112723]/70 border border-[#B7CDC6] dark:border-[#2A4A43] rounded-2xl shadow-xs">
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-base">✨</span>
                  <h3 className="text-sm font-bold text-[#12302B] dark:text-[#E4F1ED]">
                    Навіщо я кинув курити
                  </h3>
                </div>
                <p className="text-xs text-[#55726B] dark:text-[#8FAAA3] mb-3">
                  Твої особисті причини та мотивація для свободи від тютюну.
                </p>

                {/* Add reason input */}
                <div className="flex gap-2 mb-3">
                  <input
                    type="text"
                    maxLength={140}
                    value={newReasonText}
                    onChange={(e) => setNewReasonText(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && newReasonText.trim()) {
                        sounds.playClick();
                        setReasons(prev => [...prev, newReasonText.trim()]);
                        setNewReasonText('');
                      }
                    }}
                    placeholder="Наприклад: Здорове серце, дихати без задишки"
                    className="flex-1 text-xs p-2.5 bg-white dark:bg-[#112723] border border-[#B7CDC6] dark:border-[#2A4A43] rounded-xl text-[#12302B] dark:text-[#E4F1ED] focus:outline-none focus:border-[#1E8A69]"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (!newReasonText.trim()) return;
                      sounds.playClick();
                      setReasons(prev => [...prev, newReasonText.trim()]);
                      setNewReasonText('');
                    }}
                    className="px-3 py-2 bg-[#1E8A69] text-white text-xs font-bold rounded-xl flex items-center gap-1 cursor-pointer"
                  >
                    <span>+</span>
                    <span>Додати</span>
                  </button>
                </div>

                {/* Reasons list */}
                <div className="space-y-1.5">
                  {reasons.map((r, i) => (
                    <div
                      key={i}
                      className="flex items-center justify-between text-xs py-1.5 px-3 rounded-xl bg-white/60 dark:bg-[#112723]/60 border border-[#B7CDC6]/50"
                    >
                      <span className="text-[#12302B] dark:text-[#E4F1ED]">{r}</span>
                      <button
                        type="button"
                        onClick={() => {
                          sounds.playClick();
                          setReasons(prev => prev.filter((_, idx) => idx !== i));
                        }}
                        className="text-[#55726B] hover:text-red-500 p-1 cursor-pointer"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>
              
              {/* Standalone Download Section */}
              <div className="p-4 bg-gradient-to-br from-[#1E8A69]/15 to-[#4CC9A0]/15 border-2 border-[#1E8A69] rounded-2xl">
                <h4 className="text-xs font-bold text-[#12302B] dark:text-[#E4F1ED] mb-1">
                  📥 Автономний файл додатку (.html)
                </h4>
                <p className="text-[11px] text-[#55726B] dark:text-[#8FAAA3] mb-3">
                  Цей файл містить абсолютно весь код додатку в одному місці. Ви можете відкривати його офлайн без інтернету або завантажити в будь-який інший ШІ-кодер!
                </p>
                <button
                  onClick={() => {
                    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `bez-syharet-singlefile-${new Date().toISOString().slice(0, 10)}.html`;
                    a.click();
                    URL.revokeObjectURL(url);
                  }}
                  className="w-full py-2 bg-[#1E8A69] hover:bg-[#187558] text-white text-xs font-bold rounded-xl shadow-xs"
                >
                  Завантажити цей HTML-файл на пристрій
                </button>
              </div>

              {/* JSON Data Backup */}
              <button
                onClick={() => {
                  const backup = { startDate, money, goals, treeState, reasons, daysRating };
                  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `bez-syharet-data-${new Date().toISOString().slice(0, 10)}.json`;
                  a.click();
                  URL.revokeObjectURL(url);
                }}
                className="w-full py-2.5 border border-[#B7CDC6] dark:border-[#2A4A43] text-xs font-bold rounded-xl"
              >
                💾 Експортувати дані (JSON)
              </button>
            </div>
          )}

          {/* SOS Modal */}
          {isSosOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-[#112723] border border-white/20 p-6 rounded-3xl max-w-sm w-full text-center">
                <span className="text-4xl mb-2 block">🫁</span>
                <h3 className="text-base font-extrabold mb-1">Дихай разом зі мною</h3>
                <p className="text-xs text-[#55726B] dark:text-[#8FAAA3] mb-4">
                  Тяга триває всього 3 хвилини. Зроби повільний глибокий вдих на 4 секунди і видих на 6 секунд.
                </p>
                <button
                  onClick={() => setIsSosOpen(false)}
                  className="w-full py-2.5 bg-[#1E8A69] text-white font-bold text-xs rounded-xl"
                >
                  Тяга відступила, я в нормі
                </button>
              </div>
            </div>
          )}

          {/* Setup Date Modal */}
          {isSetupOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-[#112723] p-6 rounded-3xl max-w-sm w-full">
                <h3 className="text-sm font-bold mb-3">Встановіть дату відмови</h3>
                <input
                  type="datetime-local"
                  id="datePickerInput"
                  defaultValue={new Date(startDate).toISOString().slice(0, 16)}
                  className="w-full p-2 text-xs border rounded-xl mb-3 dark:bg-[#0A1614]"
                />
                <div className="flex gap-2">
                  <button onClick={() => setIsSetupOpen(false)} className="flex-1 py-1.5 border text-xs rounded-xl">Скасувати</button>
                  <button
                    onClick={() => {
                      const inp = document.getElementById('datePickerInput');
                      if (inp && inp.value) {
                        const ms = new Date(inp.value).getTime();
                        if (!isNaN(ms)) setStartDate(ms);
                      }
                      setIsSetupOpen(false);
                    }}
                    className="flex-1 py-1.5 bg-[#1E8A69] text-white text-xs font-bold rounded-xl"
                  >
                    Зберегти
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Persistent Bottom 6-Tab Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#E9F1EE]/95 dark:bg-[#0D1E1B]/95 backdrop-blur-md border-t border-[#B7CDC6] dark:border-[#2A4A43] py-2 px-2 sm:px-4 shadow-lg">
            <div className="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center">
              {/* 1. Відлік */}
              <button
                onClick={() => { sounds.playClick(); setActiveTab('counter'); }}
                className={`py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer transition-all ${
                  activeTab === 'counter' ? 'text-[#1E8A69] dark:text-[#4CC9A0] font-bold scale-105' : 'text-[#55726B] dark:text-[#8FAAA3]'
                }`}
              >
                <span className="text-lg leading-none">⏱️</span>
                <span className="text-[10px] leading-tight">Відлік</span>
              </button>

              {/* 2. Здоров'я */}
              <button
                onClick={() => { sounds.playClick(); setActiveTab('health'); }}
                className={`py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer transition-all ${
                  activeTab === 'health' ? 'text-[#1E8A69] dark:text-[#4CC9A0] font-bold scale-105' : 'text-[#55726B] dark:text-[#8FAAA3]'
                }`}
              >
                <span className="text-lg leading-none">❤️</span>
                <span className="text-[10px] leading-tight">Здоров’я</span>
              </button>

              {/* 3. SOS */}
              <button
                type="button"
                id="nav-btn-sos"
                onClick={() => { sounds.playClick(); setIsSosOpen(true); }}
                className="py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer transition-all text-[#A33A2C] dark:text-[#F08C7D]"
                aria-label="SOS"
              >
                <span className="text-lg leading-none">🚨</span>
                <span className="text-[10px] leading-tight font-semibold">SOS</span>
              </button>

              {/* 4. Стан */}
              <button
                onClick={() => { sounds.playClick(); setActiveTab('state'); }}
                className={`py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer relative transition-all ${
                  activeTab === 'state' ? 'text-[#1E8A69] dark:text-[#4CC9A0] font-bold scale-105' : 'text-[#55726B] dark:text-[#8FAAA3]'
                }`}
              >
                <span className="text-lg leading-none">😊</span>
                <span className="text-[10px] leading-tight">Стан</span>
              </button>

              {/* 5. Цілі */}
              <button
                onClick={() => { sounds.playClick(); setActiveTab('money'); }}
                className={`py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer transition-all ${
                  activeTab === 'money' ? 'text-[#1E8A69] dark:text-[#4CC9A0] font-bold scale-105' : 'text-[#55726B] dark:text-[#8FAAA3]'
                }`}
              >
                <span className="text-lg leading-none">🎯</span>
                <span className="text-[10px] leading-tight">Цілі</span>
              </button>

              {/* 6. Більше */}
              <button
                onClick={() => { sounds.playClick(); setActiveTab('more'); }}
                className={`py-1.5 flex flex-col items-center gap-0.5 rounded-xl cursor-pointer transition-all ${
                  activeTab === 'more' ? 'text-[#1E8A69] dark:text-[#4CC9A0] font-bold scale-105' : 'text-[#55726B] dark:text-[#8FAAA3]'
                }`}
              >
                <span className="text-lg leading-none">⚙️</span>
                <span className="text-[10px] leading-tight">Більше</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
